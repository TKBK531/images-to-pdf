[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "images-to-pdf"
version = "1.1.0"
description = "Desktop app that converts a folder or selection of images into a single PDF."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Tharindu Kasthurisinghe" }]
dependencies = [
    "Pillow>=10.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]
dev = ["pytest>=7.0"]

[project.gui-scripts]
images-to-pdf = "images_to_pdf.app:main"

[tool.setuptools.packages.find]
where = ["src"]
