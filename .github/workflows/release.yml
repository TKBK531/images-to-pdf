name: Build Release Binaries

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: ImagesToPDF-windows.exe
          - os: macos-latest
            asset_name: ImagesToPDF-macos.zip
          - os: ubuntu-latest
            asset_name: ImagesToPDF-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tk (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install package and PyInstaller
        run: pip install ".[build]"

      - name: Generate app icon
        run: python scripts/make_icon.py

      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller --onefile --windowed --name ImagesToPDF --icon icon.ico run.py

      # Inert until WINDOWS_CERT_BASE64 / WINDOWS_CERT_PASSWORD secrets are
      # added to the repo — see README's "Code signing" section. Without
      # them, this step is skipped and the build stays unsigned (current
      # behavior: Windows shows a SmartScreen warning on first run).
      - name: Sign Windows executable (optional)
        if: runner.os == 'Windows' && secrets.WINDOWS_CERT_BASE64 != ''
        uses: dlemstra/code-sign-action@v1
        with:
          certificate: ${{ secrets.WINDOWS_CERT_BASE64 }}
          password: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          folder: dist

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp dist/ImagesToPDF.exe "${{ matrix.asset_name }}"

      - name: Build app bundle (macOS)
        if: runner.os == 'macOS'
        run: pyinstaller --windowed --name ImagesToPDF --icon icon.icns run.py

      - name: Zip app bundle (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/ImagesToPDF.app" "${{ matrix.asset_name }}"

      - name: Build executable (Linux)
        if: runner.os == 'Linux'
        run: pyinstaller --onefile --windowed --name ImagesToPDF run.py

      - name: Rename artifact (Linux)
        if: runner.os == 'Linux'
        run: cp dist/ImagesToPDF "${{ matrix.asset_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
